<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HR Hiring Cost &amp; Vacancy Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ============================================================
   DESIGN TOKENS — corporate HR SaaS: light surfaces, navy accents,
   monospaced tabular numerals for auditable AED figures.
   ============================================================ */
:root{
  --navy:#1f2a44; --navy-700:#2c3a5e; --accent:#2f6fed; --accent-soft:#e8f0fe;
  --bg:#f4f6fa; --surface:#ffffff; --surface-2:#fafbfc;
  --border:#e6e9f0; --border-strong:#d4d9e4;
  --text:#1b2333; --text-2:#5a6478; --text-3:#8b93a6;
  --good:#1e9e6a; --good-bg:#e6f6ee; --warn:#c98a12; --warn-bg:#fdf3e0;
  --bad:#d1495b; --bad-bg:#fbe9ec; --info:#2f6fed; --info-bg:#e8f0fe;
  --purple:#7b5ea7; --purple-bg:#f0ebf8; --teal:#178a94; --teal-bg:#e2f4f5;
  --radius:10px; --radius-sm:7px;
  --shadow:0 1px 2px rgba(27,35,51,.04),0 2px 8px rgba(27,35,51,.05);
  --shadow-lg:0 8px 30px rgba(27,35,51,.14);
  --sidebar-w:238px; --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{height:10px;width:10px}
::-webkit-scrollbar-thumb{background:#cfd5e2;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#b9c0d1}

.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--navy);color:#c7cfe0;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:40;transition:transform .22s ease}
.brand{padding:20px 20px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand .logo{width:34px;height:34px;border-radius:8px;flex:none;background:#2f6fed;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.brand .t{color:#fff;font-weight:600;font-size:14.5px;line-height:1.2}
.brand .s{color:#8b96b3;font-size:11px;font-weight:500}
.nav{padding:12px;flex:1;overflow-y:auto}
.nav-label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#6d7897;padding:12px 12px 6px;font-weight:600}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:#c7cfe0;font-weight:500;font-size:13.5px;margin-bottom:2px;transition:.13s;cursor:pointer}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.active{background:var(--accent);color:#fff}
.nav a svg{width:17px;height:17px;flex:none;opacity:.9}
.nav a .badge{margin-left:auto;font-size:11px;background:rgba(255,255,255,.14);padding:1px 7px;border-radius:20px;font-family:var(--mono)}
.nav a.active .badge{background:rgba(255,255,255,.22)}
.sidebar-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;color:#6d7897;line-height:1.6}
.dirty-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#f0b429;margin-right:6px;box-shadow:0 0 0 3px rgba(240,180,41,.18)}

.main{margin-left:var(--sidebar-w);flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:0 26px;height:60px;display:flex;align-items:center;gap:16px}
.topbar h1{font-size:17px;font-weight:600}
.global-search{margin-left:auto;position:relative;width:320px;max-width:40vw}
.global-search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface-2);font-size:13px;font-family:inherit;color:var(--text)}
.global-search input:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.global-search svg{position:absolute;left:11px;top:9px;width:15px;height:15px;color:var(--text-3)}
.search-results{position:absolute;top:44px;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);max-height:60vh;overflow:auto;display:none;z-index:60;padding:6px}
.search-results.open{display:block}
.sr-item{padding:9px 11px;border-radius:7px;cursor:pointer;display:flex;gap:10px;align-items:center}
.sr-item:hover,.sr-item.hi{background:var(--surface-2)}
.sr-item .sr-id{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:600;flex:none}
.sr-empty{padding:16px;text-align:center;color:var(--text-3);font-size:13px}
.hamburger{display:none;background:none;border:1px solid var(--border-strong);border-radius:8px;width:38px;height:38px;place-items:center;color:var(--text-2)}
.content{padding:22px 26px 60px;max-width:1520px;width:100%}

.filterbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:18px;box-shadow:var(--shadow)}
.filt{display:flex;flex-direction:column;gap:5px}
.filt label{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em}
.filt select,.filt input{padding:7px 10px;border:1px solid var(--border-strong);border-radius:7px;background:#fff;font-family:inherit;font-size:13px;color:var(--text);min-width:128px}
.filt select:focus,.filt input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--border-strong);background:#fff;color:var(--text);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px;transition:.13s}
.btn:hover{background:var(--surface-2);border-color:var(--text-3)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#2560d8}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger:hover{background:#bb3d4e}
.btn.sm{padding:5px 10px;font-size:12px}
.spacer{flex:1}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:13px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow)}
.kpi .k-top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.kpi .k-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.kpi .k-ic svg{width:16px;height:16px}
.kpi .k-label{font-size:11.5px;color:var(--text-2);font-weight:600}
.kpi .k-val{font-size:22px;font-weight:600;letter-spacing:-.02em;color:var(--text);line-height:1.1;font-family:var(--mono);font-variant-numeric:tabular-nums}
.kpi .k-val .cur{font-size:11px;color:var(--text-3);font-weight:600;margin-right:3px;font-family:'Inter'}
.kpi .k-sub{font-size:11.5px;color:var(--text-3);margin-top:5px;font-weight:500}
.ic-blue{background:var(--info-bg);color:var(--info)} .ic-green{background:var(--good-bg);color:var(--good)}
.ic-amber{background:var(--warn-bg);color:var(--warn)} .ic-red{background:var(--bad-bg);color:var(--bad)}
.ic-purple{background:var(--purple-bg);color:var(--purple)} .ic-teal{background:var(--teal-bg);color:var(--teal)}
.ic-navy{background:#e9edf6;color:var(--navy)}

.grid{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.card-h h3{font-size:14px}
.card-h .hint{font-size:11.5px;color:var(--text-3);font-weight:500}
.card-h .spacer{flex:1}
.card-b{padding:16px 18px}
.chart-wrap{position:relative;height:290px}
.chart-wrap.sm{height:250px}
.two-col{grid-template-columns:1fr 1fr}
.section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);margin:24px 0 12px;display:flex;align-items:center;gap:10px}

.table-scroll{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;padding:10px 12px;font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2)}
table.tbl th.sortable{cursor:pointer;user-select:none}
table.tbl th.sortable:hover{color:var(--text)}
table.tbl th .arr{opacity:.35;font-size:10px;margin-left:3px}
table.tbl th.sorted{color:var(--accent)}
table.tbl th.sorted .arr{opacity:1}
table.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tbody tr.clickable{cursor:pointer}
table.tbl tbody tr.clickable:hover{background:#f8fafd}
table.tbl td.r,table.tbl th.r{text-align:right}
.tbl-total td{font-weight:700;background:var(--surface-2);border-top:2px solid var(--border-strong)}
.matrix td.r,.matrix th.r{font-family:var(--mono);font-variant-numeric:tabular-nums}
.matrix td.zero{color:var(--text-3);opacity:.5}
.pos-name{font-weight:600;color:var(--text)}
.muted{color:var(--text-3)}

.badge-status{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.badge-status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-Planned{background:#eef1f6;color:#5a6478} .st-Open{background:var(--info-bg);color:#2560d8}
.st-Interviewing{background:var(--purple-bg);color:var(--purple)} .st-Offer{background:var(--warn-bg);color:var(--warn)}
.st-Hired{background:var(--good-bg);color:var(--good)} .st-OnHold{background:#eef1f6;color:#8b93a6}
.st-Cancelled{background:var(--bad-bg);color:var(--bad)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:600;background:#eef1f6;color:var(--text-2)}

.act-wrap{position:relative;display:inline-block}
.act-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:#fff;display:grid;place-items:center;color:var(--text-2)}
.act-btn:hover{background:var(--surface-2);color:var(--text)}
.act-menu{position:absolute;right:0;top:34px;background:#fff;border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow-lg);padding:5px;min-width:152px;z-index:70;display:none}
.act-menu.open{display:block}
.act-menu button{width:100%;text-align:left;padding:8px 10px;border:none;background:none;border-radius:6px;font-size:13px;color:var(--text);display:flex;align-items:center;gap:9px;font-weight:500}
.act-menu button:hover{background:var(--surface-2)}
.act-menu button.del{color:var(--bad)}
.act-menu button svg{width:14px;height:14px}
.act-menu .sep{height:1px;background:var(--border);margin:4px 0}

.pager{display:flex;align-items:center;gap:6px;padding:12px 18px;justify-content:flex-end;font-size:13px;color:var(--text-2);flex-wrap:wrap}
.pager .info{margin-right:auto;color:var(--text-3);font-size:12.5px}
.pager button{min-width:32px;height:32px;padding:0 8px;border-radius:7px;border:1px solid var(--border-strong);background:#fff;color:var(--text-2)}
.pager button:hover:not(:disabled){background:var(--surface-2)}
.pager button:disabled{opacity:.4;cursor:default}
.pager button.on{background:var(--accent);border-color:var(--accent);color:#fff}

.overlay{position:fixed;inset:0;background:rgba(20,26,40,.44);z-index:100;display:none;opacity:0;transition:opacity .18s}
.overlay.open{display:block;opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:660px;max-width:96vw;background:var(--surface);z-index:101;box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .24s ease;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-h{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.drawer-h h2{font-size:16px}
.drawer-h .sub{font-size:12px;color:var(--text-3);font-family:var(--mono);margin-top:2px}
.drawer-h .x{margin-left:auto;width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:#fff;display:grid;place-items:center;color:var(--text-2);flex:none}
.drawer-h .x:hover{background:var(--surface-2)}
.drawer-b{padding:20px 22px;overflow-y:auto;flex:1}
.drawer-f{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;background:var(--surface-2)}

.form-sec{margin-bottom:20px}
.form-sec-t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:11px;display:flex;align-items:center;gap:8px}
.form-sec-t .freq{margin-left:auto;font-size:10.5px;color:var(--text-3);background:var(--surface-2);border:1px solid var(--border);padding:2px 8px;border-radius:20px;font-weight:600;letter-spacing:0;text-transform:none}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg.full{grid-column:1 / -1}
.fg label{font-size:12px;font-weight:600;color:var(--text-2)}
.fg label .req{color:var(--bad)}
.fg input,.fg select{padding:8px 11px;border:1px solid var(--border-strong);border-radius:7px;font-family:inherit;font-size:13px;color:var(--text);background:#fff;width:100%}
.fg input:focus,.fg select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fg .cur-in{position:relative}
.fg .cur-in input{padding-left:42px;font-family:var(--mono)}
.fg .cur-in::before{content:"AED";position:absolute;left:11px;top:9px;font-size:11px;color:var(--text-3);font-weight:600;pointer-events:none}
.fg .err-msg{font-size:11.5px;color:var(--bad);font-weight:500;display:none}
.fg.invalid input,.fg.invalid select{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-bg)}
.fg.invalid .err-msg{display:block}
.calc-preview{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:13px 15px}
.calc-preview .cp-row{display:flex;justify-content:space-between;padding:4px 0;font-size:12.5px;color:var(--text-2)}
.calc-preview .cp-row span:last-child{font-family:var(--mono);color:var(--text);font-weight:500}
.calc-preview .cp-row.total{border-top:1px solid var(--border-strong);margin-top:5px;padding-top:8px;font-weight:700;font-size:14px;color:var(--text)}

.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px;margin-bottom:8px}
.d-item .d-l{font-size:11px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.d-item .d-v{font-size:14px;font-weight:600;color:var(--text);margin-top:2px}
.cost-cat{margin-top:16px}
.cost-cat h4{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-3);margin-bottom:8px;display:flex;justify-content:space-between}
.cost-cat h4 span:last-child{font-family:var(--mono);color:var(--text-2)}
.cost-line{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--border);font-size:13px;color:var(--text-2)}
.cost-line span:last-child{font-family:var(--mono);font-weight:500;color:var(--text)}
.tl-bars{display:flex;align-items:flex-end;gap:2px;height:120px;padding:8px 0 26px;overflow-x:auto}
.tl-col{flex:1;min-width:16px;display:flex;flex-direction:column;align-items:center;gap:0;position:relative;height:100%;justify-content:flex-end}
.tl-col .bar{width:70%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.tl-col .bar.hl{background:var(--warn)}
.tl-col .lb{position:absolute;bottom:-22px;font-size:8.5px;color:var(--text-3);transform:rotate(-50deg);white-space:nowrap;font-family:var(--mono);transform-origin:top left;left:50%}
.tl-col:hover .bar{opacity:.8}
.tl-table{margin-top:26px}

.co-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:13px}
.co-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:.15s}
.co-card:hover{border-color:var(--accent);box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.co-card.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.co-card .co-name{font-size:15px;font-weight:600;margin-bottom:3px}
.co-card .co-meta{font-size:11.5px;color:var(--text-3);margin-bottom:12px}
.co-card .co-stat{display:flex;justify-content:space-between;padding:4px 0;font-size:12.5px;color:var(--text-2)}
.co-card .co-stat span:last-child{font-family:var(--mono);font-weight:600;color:var(--text)}

.insights{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:12px}
.insight{display:flex;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 15px;box-shadow:var(--shadow)}
.insight .i-ic{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center}
.insight .i-ic svg{width:17px;height:17px}
.insight .i-t{font-size:12px;color:var(--text-3);font-weight:600}
.insight .i-v{font-size:14px;font-weight:600;margin-top:2px;line-height:1.35}

.empty{text-align:center;padding:48px 20px;color:var(--text-3)}
.empty svg{width:42px;height:42px;opacity:.4;margin-bottom:12px}
.empty h4{font-size:15px;color:var(--text-2);margin-bottom:5px}
.empty p{font-size:13px;max-width:380px;margin:0 auto}

.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--navy);color:#fff;padding:12px 16px;border-radius:9px;box-shadow:var(--shadow-lg);font-size:13px;font-weight:500;display:flex;align-items:center;gap:10px;min-width:220px;animation:slidein .2s ease}
.toast.good{background:#186a4a} .toast.bad{background:#b23347}
.toast svg{width:17px;height:17px;flex:none}
@keyframes slidein{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}

#loader{position:fixed;inset:0;background:var(--bg);z-index:300;display:grid;place-items:center}
.spinner{width:38px;height:38px;border:3px solid var(--border-strong);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
#loader .lt{margin-top:14px;color:var(--text-2);font-size:13px;font-weight:500}
.load-error{max-width:560px;margin:8vh auto;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);text-align:left}
.load-error h3{color:var(--bad);margin-bottom:10px}
.load-error code{background:var(--surface-2);padding:2px 7px;border-radius:5px;font-family:var(--mono);font-size:12.5px;border:1px solid var(--border)}
.load-error pre{background:var(--navy);color:#e5ebf5;padding:12px 14px;border-radius:8px;font-size:12.5px;overflow-x:auto;margin-top:10px}

.page{display:none}
.page.active{display:block}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:8px;padding:3px;gap:2px}
.seg button{border:none;background:none;padding:6px 12px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--text-2)}

  upload:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>',
  refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></svg>',
  inbox:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>',
  target:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>',
};

/* ------------------------------------------------------------------ constants */
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const STATUSES = ['Planned','Open','Interviewing','Offer','Hired','On Hold','Cancelled'];
const VAC_TYPES = ['Back Fill','New Role'];
const BIZ_CATS = ['Business Development','Service/Operations','Admin'];
const STORE_KEY = 'hrHiringApp.v1';
const CHART_COLORS = ['#2f6fed','#1e9e6a','#c98a12','#7b5ea7','#178a94','#d1495b','#3a4a72','#e8875a','#5b8def','#9aa4bd'];
const now = new Date();
const REF_YEAR = now.getFullYear();
const REF_MONTH = now.getMonth() + 1; // 1..12

/* ------------------------------------------------------------------ state */
const state = {
  meta: {currency:'AED'},
  columns: [],
  original: [],       // pristine vacancies from data.json
  vacancies: [],      // working set (original merged with local changes)
  dirty: false,
  route: 'overview',
  filters: {year:'', month:'', company:'', department:'', status:'', type:'', vtype:'', bcat:''},
  coFilters: {department:'', status:'', year:'', month:'', type:'', vtype:'', bcat:''},
  deFilters: {company:'', status:'', year:'', month:'', type:'', vtype:'', bcat:''},
  vacFilters: {company:'', department:'', position:'', status:'', month:'', year:'', search:'', type:'', vtype:'', bcat:'', hmgr:'', rmgr:''},
  vacSort: {key:'id', dir:1},
  vacPage: 1,
  vacPerPage: 12,
  monthlyYear: REF_YEAR,
  selectedCompany: null,
  selectedHiredCompany: null,
  hiredYear: '',
  hiredType: '',
  hiredVType: '',
  hiredBCat: '',
  charts: {},
  searchIdx: -1,
};

/* ------------------------------------------------------------------ helpers */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const el = (tag, cls, html) => { const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; };
function escapeHtml(v){ if(v==null) return ''; return String(v).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function sum(obj){ if(!obj) return 0; return Object.values(obj).reduce((a,b)=> a + (Number(b)||0), 0); }
function statusClass(s){ return 'st-' + String(s||'Planned').replace(/\s+/g,''); }
function fmt(n){
  const v = Math.round(Number(n)||0);
  return new Intl.NumberFormat('en-AE',{maximumFractionDigits:0}).format(v);
}
function aed(n){ return '<span class="cur">AED</span>' + fmt(n); }
function aedTxt(n){ return 'AED ' + fmt(n); }
function shortAed(n){
  n = Number(n)||0;
  if(Math.abs(n) >= 1e6) return 'AED ' + (n/1e6).toFixed(2).replace(/\.00$/,'') + 'M';
  if(Math.abs(n) >= 1e3) return 'AED ' + (n/1e3).toFixed(1).replace(/\.0$/,'') + 'K';
  return 'AED ' + fmt(n);
}
function parseDate(iso){ if(!iso) return null; const p=String(iso).slice(0,10).split('-'); if(p.length<2) return null; const y=+p[0], m=+p[1]; if(!y||!m) return null; return {y, m, d:+p[2]||1}; }
function fmtDate(iso){ const d=parseDate(iso); if(!d) return '—'; return String(d.d).padStart(2,'0')+' '+MONTHS[d.m-1]+' '+d.y; }
function monthLabel(y,m){ return MONTHS[m-1]+' '+y; }
function daysBetween(a,b){ const da=parseDate(a), db=parseDate(b); if(!da||!db) return null; return Math.round((Date.UTC(db.y,db.m-1,db.d)-Date.UTC(da.y,da.m-1,da.d))/86400000); }

/* ============================================================================
   COST CALCULATION ENGINE   (pure functions; no DOM)
   ========================================================================== */
/* Effective cost-start date: the actual hired date for Hired employees, else the planned hiring date. */
function effDate(rec){ return (rec.status==='Hired' && rec.hiredDate)? rec.hiredDate : rec.hiringDate; }
function costPrimitives(rec){
  const q = Number(rec.qty)||1;
  const c = rec.costs || {};
  return {
    oneTime: sum(c.oneTime)*q,
    monthly: (sum(c.monthlyRecurring)+sum(c.monthly))*q,
    annual:  sum(c.annual)*q,
    twoYear: sum(c.twoYear)*q,
  };
}
function isCostEligible(rec){ return rec.status !== 'Cancelled'; }
function monthsSince(rec, year, month){
  const d = parseDate(effDate(rec)); if(!d) return null;
  return (year - d.y)*12 + (month - d.m);
}
/* Total cost for one record in a given calendar month. */
function calculateMonthlyCost(rec, year, month){
  if(!isCostEligible(rec)) return 0;
  const k = monthsSince(rec, year, month);
  if(k===null || k<0) return 0;
  const p = costPrimitives(rec);
  let t = p.monthly;                       // recurring every month
  if(k===0) t += p.oneTime;                // one-time at hire month
  if(k%12===0) t += p.annual;              // annual at hire + anniversaries
  if(k%24===0) t += p.twoYear;             // two-year at hire + every 24 mo
  return t;
}
/* Itemised breakdown for one month (for the audit/detail view). */
function monthlyCostDetail(rec, year, month){
  const out = [];
  if(!isCostEligible(rec)) return out;
  const k = monthsSince(rec, year, month);
  if(k===null || k<0) return out;
  const q = Number(rec.qty)||1;
  const c = rec.costs || {};
  const push = (obj, cat) => { for(const [label,amt] of Object.entries(obj||{})){ const v=(Number(amt)||0)*q; if(v>0) out.push({label, amount:v, category:cat}); } };
  push(c.monthlyRecurring,'Monthly'); push(c.monthly,'Monthly');
  if(k===0) push(c.oneTime,'One-time');
  if(k%12===0) push(c.annual,'Annual');
  if(k%24===0) push(c.twoYear,'Two-year');
  return out;
}
function calculateAnnualCost(rec, year){ let t=0; for(let m=1;m<=12;m++) t+=calculateMonthlyCost(rec,year,m); return t; }
function calculateTwoYearCost(rec){
  const d = parseDate(effDate(rec)); if(!d) return 0;
  let t=0;
  for(let k=0;k<24;k++){ const y=d.y+Math.floor((d.m-1+k)/12); const m=((d.m-1+k)%12)+1; t+=calculateMonthlyCost(rec,y,m); }
  return t;
}
function calculateOneTimeCosts(rec){ return isCostEligible(rec)? costPrimitives(rec).oneTime : 0; }
function calculateRecurringMonthlyCosts(rec){ return isCostEligible(rec)? costPrimitives(rec).monthly : 0; }

/* Forecast: total across records for N months starting at (startY,startM). */
function forecastRange(records, startY, startM, nMonths){
  const arr=[];
  for(let i=0;i<nMonths;i++){
    const y=startY+Math.floor((startM-1+i)/12); const m=((startM-1+i)%12)+1;
    let total=0; records.forEach(r=> total+=calculateMonthlyCost(r,y,m));
    arr.push({year:y, month:m, label:monthLabel(y,m), total});
  }
  return arr;
}
function generateMonthlyForecast(rec, nMonths){
  const d=parseDate(effDate(rec)); if(!d) return [];
  return forecastRange([rec], d.y, d.m, nMonths);
}

/* Aggregations over a set of records */
function aggregate(records){
  let oneTime=0, monthlyCommit=0, twoYear=0;
  records.forEach(r=>{ if(!isCostEligible(r)) return; const p=costPrimitives(r); oneTime+=p.oneTime; monthlyCommit+=p.monthly; twoYear+=calculateTwoYearCost(r); });
  return {oneTime, monthlyCommit, twoYear, count:records.length};
}

/* ============================================================================
   STORAGE  (data.json + localStorage merge)
   ========================================================================== */
function loadLocal(){ try{ const raw=localStorage.getItem(STORE_KEY); return raw? JSON.parse(raw):null; }catch(e){ return null; } }
function persist(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify({vacancies:state.vacancies, savedAt:new Date().toISOString()})); }
  catch(e){ toast('Could not save locally: '+e.message,'bad'); }
  state.dirty = true; renderDirty();
}
function renderDirty(){
  const foot = $('#sideFoot');
  if(state.dirty){
    foot.innerHTML = '<span class="dirty-dot"></span>Local changes saved in this browser.<br>Use <b>data.json</b> (top bar) to publish them.';
  }else{
    foot.innerHTML = state.vacancies.length + ' vacancies loaded.<br>Top bar: download data.json / Excel, upload Excel.';
  }
}

/* ============================================================================
   BOOT
   ========================================================================== */
async function boot(){
  if(typeof Chart!=='undefined' && Chart.register && typeof ChartDataLabels!=='undefined'){
    try{ Chart.register(ChartDataLabels); if(Chart.defaults&&Chart.defaults.plugins) Chart.defaults.plugins.datalabels={display:false}; }catch(e){}
  }
  buildNav();
  $('#searchIcon').innerHTML = I.search;
  $('#hamburger').innerHTML = I.menu;
  buildTopActions();
  $('#drawerClose').innerHTML = I.x;
  wireGlobalEvents();
  try{
    const res = await fetch(window.APP_DATA_URL, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    ingest(data);
  }catch(err){
    showLoadError(err); return;
  }
  $('#loader').style.display='none';
  $('#app').style.display='flex';
  navigate('overview');

function ingest(data){
  state.meta = data.metadata || {currency:'AED'};
  state.columns = data.columns || [];

  const local = loadLocal();
  if(local && Array.isArray(local.vacancies) && local.vacancies.length){
    state.vacancies = local.vacancies.map(normalize);
    state.dirty = true;
  }else{
    state.vacancies = state.original.map(v=>JSON.parse(JSON.stringify(v)));
    state.dirty = false;
  }
  renderDirty();
}
function normalize(v){
  v = Object.assign({}, v);
  v.qty = Number(v.qty)||1;
  v.status = v.status || 'Planned';

  v.hiringManager = v.hiringManager || '';

  v.businessCategory = v.businessCategory || '';
  if(v.businessCategory==='Service/Operations & Admin') v.businessCategory='Service/Operations';
  if(v.company==='ME - KSA') v.company='MGE - KSA';
  v.costs = v.costs || {oneTime:{},monthlyRecurring:{},twoYear:{},annual:{},monthly:{}};
  ['oneTime','monthlyRecurring','twoYear','annual','monthly'].forEach(k=>{ v.costs[k]=v.costs[k]||{}; });

}

function uniq(key){ return Array.from(new Set(state.vacancies.map(v=>v[key]).filter(Boolean))).sort(); }
function filteredForOverview(){
  const f=state.filters;
  return state.vacancies.filter(v=>{
    if(f.company && v.company!==f.company) return false;
    if(f.department && v.department!==f.department) return false;
    if(f.status && v.status!==f.status) return false;
    if(f.type && v.collarType!==f.type) return false;
    if(f.vtype && v.vacancyType!==f.vtype) return false;
    if(f.bcat && v.businessCategory!==f.bcat) return false;
    const d=parseDate(v.hiringDate);
    if(f.month && (!d || d.m!==+f.month)) return false;
    // NOTE: Year is a cost-view selector (2026/2027/2028), not a hiring-date filter —
    // hires from 2026 keep incurring recurring/annual costs in later years.
    return true;
  });
}
/* Period helper: returns {label, fn} for a year/month cost view, or null for All. */
function periodInfo(f){
  const y=+ (f.year||0), m=+ (f.month||0);
  if(y&&m) return {label:MONTHS[m-1]+' '+y, fn:r=>calculateMonthlyCost(r,y,m)};
  if(y)    return {label:String(y),          fn:r=>calculateAnnualCost(r,y)};
  if(m)    return {label:MONTHS[m-1]+' '+REF_YEAR, fn:r=>calculateMonthlyCost(r,REF_YEAR,m)};
  return null;
}
/* Decompose one calendar year into cost buckets + per-line-item heads. */
function yearBuckets(recs, Y){
  let one=0, rec=0, ann=0, two=0; const heads={};
  recs.forEach(r=>{
    if(!isCostEligible(r)) return;
    const d=parseDate(effDate(r)); if(!d) return;
    const q=Number(r.qty)||1; const c=r.costs||{}; const p=costPrimitives(r);
    const addHeads=(obj)=>{ for(const[kk,v] of Object.entries(obj||{})) heads[kk]=(heads[kk]||0)+(Number(v)||0)*q; };
    for(let m=1;m<=12;m++){
      const k=(Y-d.y)*12+(m-d.m); if(k<0) continue;
      rec+=p.monthly; addHeads(c.monthlyRecurring); addHeads(c.monthly);
      if(k===0){ one+=p.oneTime; addHeads(c.oneTime); }
      if(k%12===0){ ann+=p.annual; addHeads(c.annual); }
      if(k%24===0){ two+=p.twoYear; addHeads(c.twoYear); }
    }
  });
  return {one, rec, ann, two, heads};
}
/* Cost-heads (line items) totals for a filter's period: All -> 24-month view,
   year -> that year, year+month (or month) -> that single month. */
function costHeadsForPeriod(recs, f){
  const y=+ (f.year||0), m=+ (f.month||0);
  const heads={};
  const addObj=(obj,q,mult)=>{ for(const[k,v] of Object.entries(obj||{})) heads[k]=(heads[k]||0)+(Number(v)||0)*q*mult; };
  if(!y && !m){
    recs.forEach(r=>{ if(!isCostEligible(r)) return; const q=Number(r.qty)||1; const c=r.costs||{};
      addObj(c.oneTime,q,1); addObj(c.monthlyRecurring,q,24); addObj(c.monthly,q,24); addObj(c.annual,q,2); addObj(c.twoYear,q,1); });
    return heads;
  }
  if(y && !m) return yearBuckets(recs, y).heads;
  const Y=y||REF_YEAR, M=m;
  recs.forEach(r=>{
    if(!isCostEligible(r)) return;
    const d=parseDate(effDate(r)); if(!d) return;
    const k=(Y-d.y)*12+(M-d.m); if(k<0) return;
    const q=Number(r.qty)||1; const c=r.costs||{};
    addObj(c.monthlyRecurring,q,1); addObj(c.monthly,q,1);
    if(k===0) addObj(c.oneTime,q,1);
    if(k%12===0) addObj(c.annual,q,1);
    if(k%24===0) addObj(c.twoYear,q,1);
  });
  return heads;
}
function years(){
  const ys=new Set();
  state.vacancies.forEach(v=>{ const d=parseDate(v.hiringDate); if(d) ys.add(d.y); });
  ys.add(REF_YEAR); ys.add(REF_YEAR+1); ys.add(REF_YEAR+2);
  return Array.from(ys).sort();
}

function drawOverviewCharts(recs, eligible, viewYear){
  const allView = !viewYear;               // "All years" — full 24-month view
  const yr = viewYear || REF_YEAR;
  // Monthly Employment Cost: per-month for a year, or per-year totals for All
  if(allView){
    const ys=years();
    const totals=ys.map(y=> eligible.reduce((s,r)=>s+calculateAnnualCost(r,y),0));
    makeChart('ovMonthly','bar',{labels:ys.map(String),datasets:[{data:totals,backgroundColor:'#2f6fed',borderRadius:5,maxBarThickness:70}]},withDL(barMoneyOpts('Cost by year — all years'),DL_BAR));
  }else{
    const monthly = MONTHS.map((_,i)=> eligible.reduce((s,r)=>s+calculateMonthlyCost(r,yr,i+1),0));
    makeChart('ovMonthly','bar',{labels:MONTHS,datasets:[{data:monthly,backgroundColor:'#2f6fed',borderRadius:5,maxBarThickness:38}]},withDL(barMoneyOpts('Cost — '+yr),DL_BAR));
  }
  // Department — selected-year cost, or 2-year total for All
  const byDe={}; eligible.forEach(r=>{ const v=allView? calculateTwoYearCost(r) : calculateAnnualCost(r,yr); byDe[r.department]=(byDe[r.department]||0)+v; });
  const deE=Object.entries(byDe).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
  makeChart('ovDept','doughnut',{labels:deE.map(x=>x[0]),datasets:[{data:deE.map(x=>x[1]),backgroundColor:CHART_COLORS,borderWidth:2,borderColor:'#fff'}]},withDL(donutMoneyOpts(),DL_DONUT_MONEY));
  // Status — counts
  const byStatus={}; STATUSES.forEach(s=>byStatus[s]=0); recs.forEach(r=>byStatus[r.status]=(byStatus[r.status]||0)+1);
  const stE=Object.entries(byStatus).filter(x=>x[1]>0);
  makeChart('ovStatus','doughnut',{labels:stE.map(x=>x[0]),datasets:[{data:stE.map(x=>x[1]),backgroundColor:stE.map(x=>statusColor(x[0])),borderWidth:2,borderColor:'#fff'}]},withDL(donutCountOpts(),DL_DONUT_COUNT));

  // Category charts — LINKED to the year filter
  let labels, catData, one, recurring, annual, twoY, heads;
  if(allView){
    one=0; recurring=0; annual=0; twoY=0; heads={};
    eligible.forEach(r=>{
      const p=costPrimitives(r); one+=p.oneTime; recurring+=p.monthly*24; annual+=p.annual*2; twoY+=p.twoYear;
      const q=Number(r.qty)||1;
      const add=(obj,mult)=>{ for(const[k,v] of Object.entries(obj||{})){ heads[k]=(heads[k]||0)+(Number(v)||0)*q*mult; } };
      add(r.costs.oneTime,1); add(r.costs.monthlyRecurring,24); add(r.costs.monthly,24); add(r.costs.annual,2); add(r.costs.twoYear,1);
    });
    labels=['Recurring ×24','One-time','Annual ×2','Two-year'];
    catData=[recurring,one,annual,twoY];
  }else{
    const b=yearBuckets(eligible, yr);
    one=b.one; recurring=b.rec; annual=b.ann; twoY=b.two; heads=b.heads;
    labels=['Recurring','One-time','Annual','Two-year'];
    catData=[recurring,one,annual,twoY];
  }
  makeChart('ovBreakdown','bar',{labels,datasets:[{data:catData,backgroundColor:['#2f6fed','#d1495b','#c98a12','#178a94'],borderRadius:5,maxBarThickness:60}]},withDL(barMoneyOpts(allView?'Full 24-month view':'Cost incurred in '+yr),DL_BAR));
  makeChart('ovFixedRec','doughnut',{labels:['One-time (fixed)','Recurring'],datasets:[{data:[one,recurring+annual+twoY],backgroundColor:['#d1495b','#2f6fed'],borderWidth:2,borderColor:'#fff'}]},withDL(donutMoneyOpts(),DL_DONUT_MONEY));
  const cats=Object.entries(heads).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
  makeChart('ovHeads','bar',{labels:cats.map(x=>x[0].replace(/\s*\(.*?\)/,'')),datasets:[{data:cats.map(x=>x[1]),backgroundColor:cats.map((_,i)=>CHART_COLORS[i%CHART_COLORS.length]),borderRadius:4,maxBarThickness:22}]},withDL(barMoneyOptsH(),DL_BAR));
}

      '<td style="font-size:12px">'+escapeHtml(r.hiringManager||'—')+'</td>'+
      '<td style="font-size:12px">'+escapeHtml(r.reportingManager||'—')+'</td>'+

      '<td class="r">'+actionsMenu(r.id)+'</td></tr>';
  });
  html+='</tbody></table></div>';
  const body=el('div'); body.innerHTML=html; card.appendChild(body);

  // pager
  const pager=el('div','pager');
  pager.innerHTML='<span class="info">Page '+state.vacPage+' of '+pages+' · '+recs.length+' vacancies</span>';
  const prev=el('button',null,'‹'); prev.disabled=state.vacPage<=1; prev.onclick=()=>{state.vacPage--;render();};
  pager.appendChild(prev);
  const maxBtns=7; let s=Math.max(1,state.vacPage-3), e=Math.min(pages,s+maxBtns-1); s=Math.max(1,e-maxBtns+1);
  for(let p=s;p<=e;p++){ const b=el('button',(p===state.vacPage?'on':''),String(p)); b.onclick=()=>{state.vacPage=p;render();}; pager.appendChild(b); }
  const next=el('button',null,'›'); next.disabled=state.vacPage>=pages; next.onclick=()=>{state.vacPage++;render();};
  pager.appendChild(next);
  card.appendChild(pager);
  c.appendChild(card);

  // wire
  card.querySelectorAll('th.sortable').forEach(th=>th.onclick=()=>{ const k=th.dataset.k; if(state.vacSort.key===k)state.vacSort.dir*=-1; else state.vacSort={key:k,dir:1}; render(); });
  card.querySelectorAll('[data-open]').forEach(td=>{ td.style.cursor='pointer'; td.onclick=()=>openDetail(td.dataset.open); });
  wireActionMenus(card);
}

function wireActionMenus(root){

function coFiltered(){
  const f=state.coFilters;
  return state.vacancies.filter(v=>{
    if(f.department && v.department!==f.department) return false;
    if(f.status && v.status!==f.status) return false;
    if(f.type && v.collarType!==f.type) return false;
    if(f.vtype && v.vacancyType!==f.vtype) return false;
    if(f.bcat && v.businessCategory!==f.bcat) return false;
    return true;
  });
}
function companyRows(){
  const base=coFiltered();
  const pi=periodInfo(state.coFilters);
  const cos=Array.from(new Set(base.map(v=>v.company).filter(Boolean))).sort();
  return cos.map(co=>{
    const recs=base.filter(v=>v.company===co);
    const elig=recs.filter(isCostEligible);
    const monthly=elig.reduce((s,r)=>s+costPrimitives(r).monthly,0);
    const period=elig.reduce((s,r)=>s+(pi? pi.fn(r) : calculateAnnualCost(r,REF_YEAR)),0);
    const two=elig.reduce((s,r)=>s+calculateTwoYearCost(r),0);
    const hired=recs.filter(r=>r.status==='Hired').length;
    return {co,vac:recs.length,hired,monthly,period,two,avg:elig.length?two/elig.length:0};
  }).sort((a,b)=>b.two-a.two);
}

function deFiltered(){
  const f=state.deFilters;
  return state.vacancies.filter(v=>{
    if(f.company && v.company!==f.company) return false;
    if(f.status && v.status!==f.status) return false;
    if(f.type && v.collarType!==f.type) return false;
    if(f.vtype && v.vacancyType!==f.vtype) return false;
    if(f.bcat && v.businessCategory!==f.bcat) return false;
    return true;
  });
}
function deSelect(label,key,options,fmtFn){
  const wrap=el('div','filt'); let html='<label>'+label+'</label><select>';
  options.forEach(o=>{ const txt=fmtFn?fmtFn(o):(o===''?'All':o); html+='<option value="'+escapeHtml(o)+'"'+(String(state.deFilters[key])===String(o)?' selected':'')+'>'+escapeHtml(txt)+'</option>'; });
  html+='</select>'; wrap.innerHTML=html;
  wrap.querySelector('select').onchange=e=>{ state.deFilters[key]=e.target.value; render(); };
  return wrap;
}

let formState=null;
function costFieldKeys(){

  const sample = state.vacancies.find(v=>v.costs) || state.original[0];
  const g=k=> sample&&sample.costs&&sample.costs[k]? Object.keys(sample.costs[k]) : [];
  return {
    oneTime:g('oneTime'), monthlyRecurring:g('monthlyRecurring'),
    twoYear:g('twoYear'), annual:g('annual'), monthly:g('monthly')
  };
}

function costCat(title,obj,qty){

  return h+'</div>';
}

/* ---- Excel upload: rows -> vacancy records (template or original sheet format) ---- */
function toISODate(v){
  if(v==null||v==='') return '';
  if(v instanceof Date && !isNaN(v)) return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
  if(typeof v==='number'){ const d=new Date(Math.round((v-25569)*86400*1000)); return isNaN(d)?'':d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); }
  const s=String(v).trim();
  if(/^\d{4}-\d{1,2}-\d{1,2}/.test(s)){ const p=s.slice(0,10).split('-'); return p[0]+'-'+p[1].padStart(2,'0')+'-'+p[2].padStart(2,'0'); }
  const d=new Date(s); return isNaN(d)?'':d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function num(v){ const n=Number(String(v==null?'':v).replace(/[^0-9.\-]/g,'')); return isFinite(n)? n:0; }
const ORIGINAL_BUCKETS={
  oneTime:['Visit Visa','Airfare Ticket','Recruitment Agency Fee'],
  monthlyRecurring:['Accommodation','Transportation','Salary'],
  twoYear:['Res. Visa & Labor card','Gratuity'],
  annual:['Medical Ins.','GLPA Ins.','WC Ins.','ConnectHR Software','Airfare ticket allow.'],
  monthly:['Postpaid Plan']
};
function rowsToVacancies(rows){
  if(!rows.length) return {vacancies:[],mode:'empty'};
  const headers=Object.keys(rows[0]);
  const isTemplate=headers.some(h=>/\[(One-time|Monthly|Annual|2-Year)\]/.test(h)) || headers.includes('Position');
  const findH=(name)=>headers.find(h=>h.trim().toLowerCase()===name.toLowerCase());
  const get=(row,name)=>{ const h=findH(name); return h!=null? row[h] : ''; };
  const out=[];
  rows.forEach(row=>{
    const rec=blankRecord();
    if(isTemplate){
      rec.id=String(get(row,'ID')||'').trim()||null;
      rec.qty=Math.max(1,Math.round(num(get(row,'Qty'))||1));
      rec.employeeName=String(get(row,'Employee Name')||'').trim()||null;
      rec.position=String(get(row,'Position')||get(row,'Job Title')||'').trim();
      rec.company=String(get(row,'Company')||'').trim();
      rec.department=String(get(row,'Department')||'').trim();
      rec.collarType=String(get(row,'Type')||'').trim();
      rec.employmentType=String(get(row,'Employment')||get(row,'Employment Type')||'').trim();
      rec.localOverseas=String(get(row,'Local/Overseas')||'').trim();
      rec.status=STATUSES.includes(String(get(row,'Status')).trim())? String(get(row,'Status')).trim():'Planned';
      rec.hiringDate=toISODate(get(row,'Request to Hire')||get(row,'Hiring Date')||get(row,'DATE'));
      rec.hiredDate=toISODate(get(row,'Actual Start Date')||get(row,'Hired Date'))||null;
      rec.hiringManager=String(get(row,'Hiring Manager')||'').trim();
      rec.reportingManager=String(get(row,'Reporting Manager')||'').trim();
      rec.vacancyType=String(get(row,'Vacancy Type')||'').trim();
      rec.businessCategory=String(get(row,'Business Category')||'').trim();
      rec.remarks=String(get(row,'Remarks')||'').trim();
      headers.forEach(h=>{
        const m=/^(.*?)\s*\[(One-time|Monthly|Annual|2-Year)\]$/.exec(h.trim());
        if(!m) return;
        const label=m[1].trim(); const tag=m[2]; const val=num(row[h]); if(!(val>0)) return;
        const bucket= tag==='One-time'?'oneTime': tag==='Annual'?'annual': tag==='2-Year'?'twoYear':'monthlyRecurring';
        rec.costs[bucket][label]=val;
      });
    }else{
      // original workbook layout: match known cost heads by name
      rec.qty=Math.max(1,Math.round(num(get(row,'QTY'))||1));
      rec.employeeName=String(get(row,'Employee Name')||'').trim()||null;
      rec.position=String(get(row,'Job Title')||'').trim();
      rec.company=String(get(row,'Company')||'').trim();
      rec.department=String(get(row,'Department')||'').trim();
      rec.collarType=String(get(row,'Type')||'').trim();
      rec.employmentType=String(get(row,'Employment Type')||'').trim();
      rec.localOverseas=String(get(row,'Local/Overseas')||'').trim();
      rec.hiringDate=toISODate(get(row,'DATE'));
      for(const [bucket,names] of Object.entries(ORIGINAL_BUCKETS)){
        names.forEach(n=>{
          const h=headers.find(x=>x.trim().toLowerCase().startsWith(n.toLowerCase().slice(0,10)));
          if(h){ const v=num(row[h]); if(v>0) rec.costs[bucket][n]=v; }
        });
      }
    }
    if(rec.company==='ME - KSA') rec.company='MGE - KSA';
    if(!rec.position && !rec.company) return; // skip blank rows
    out.push(rec);
  });
  // assign missing / duplicate IDs
  const seen=new Set(out.filter(r=>r.id).map(r=>r.id));
  out.forEach(r=>{
    if(!r.id || (seen.has(r.id) && out.filter(x=>x.id===r.id).length>1 && out.indexOf(r)!==out.findIndex(x=>x.id===r.id))){
      const d=parseDate(r.hiringDate); const yr=d?d.y:REF_YEAR;
      let mx=0; out.concat(state.vacancies).forEach(v=>{ const m=/^VAC-(\d{4})-(\d+)$/.exec(v.id||''); if(m&&+m[1]===yr) mx=Math.max(mx,+m[2]); });
      r.id='VAC-'+yr+'-'+String(mx+1).padStart(3,'0');
    }
    seen.add(r.id);
  });
  return {vacancies:out, mode:isTemplate?'template':'original'};
}
function importExcelFile(file){
  if(typeof XLSX==='undefined'){ toast('Excel library not loaded — internet required','bad'); return; }
  const reader=new FileReader();

      const wb=XLSX.read(reader.result,{type:'array',cellDates:true});
      const sheetName= wb.SheetNames.includes('Vacancies')? 'Vacancies' : wb.SheetNames[0];
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{defval:''});

  };
  reader.readAsArrayBuffer(file);
}

  const cancel=el('button','btn','Cancel');cancel.onclick=closeDrawer;

  ok.onclick=()=>{ localStorage.removeItem(STORE_KEY); state.vacancies=state.original.map(v=>JSON.parse(JSON.stringify(v))); state.dirty=false; renderDirty(); closeDrawer(); render(); toast('Reset to original data','good'); };
  $('#drawerFoot').appendChild(cancel);$('#drawerFoot').appendChild(ok);
  openDrawer();
}

/* ============================================================================
   GLOBAL SEARCH
   ========================================================================== */
function runSearch(q){
  const box=$('#searchResults'); q=q.trim().toLowerCase();
  if(!q){ box.classList.remove('open'); box.innerHTML=''; return; }
  const hits=state.vacancies.filter(v=>[v.id,v.position,v.company,v.department,v.employeeName].some(x=>x&&String(x).toLowerCase().includes(q))).slice(0,12);
  if(!hits.length){ box.innerHTML='<div class="sr-empty">No matches for “'+escapeHtml(q)+'”</div>'; box.classList.add('open'); return; }
  box.innerHTML=hits.map(v=>'<div class="sr-item" data-id="'+v.id+'"><span class="sr-id">'+v.id+'</span><span>'+escapeHtml(v.position)+' <span class="muted">· '+escapeHtml(v.company)+'</span></span></div>').join('');
  box.classList.add('open');
  box.querySelectorAll('.sr-item').forEach(it=>it.onclick=()=>{ box.classList.remove('open'); $('#globalSearch').value=''; openDetail(it.dataset.id); });
}

function fgText(label,key,val,req){ return '<div class="fg"><label>'+label+(req?' <span class="req">*</span>':'')+'</label><input type="text" data-field-key="'+key+'" value="'+escapeHtml(val||'')+'"><span class="err-msg"></span></div>'; }

function fgDate(label,key,val,req){ return '<div class="fg"><label>'+label+(req?' <span class="req">*</span>':'')+'</label><input type="date" data-field-key="'+key+'" value="'+escapeHtml((val||'').slice(0,10))+'"><span class="err-msg"></span></div>'; }
function fgSelect(label,key,val,options,req,allowNew){
  let html='<div class="fg"><label>'+label+(req?' <span class="req">*</span>':'')+'</label><select data-field-key="'+key+'">';
  const has=options.includes(val);
  options.forEach(o=>html+='<option value="'+escapeHtml(o)+'"'+(String(o)===String(val)?' selected':'')+'>'+(o===''?'— select —':escapeHtml(o))+'</option>');
  if(allowNew && val && !has) html+='<option value="'+escapeHtml(val)+'" selected>'+escapeHtml(val)+'</option>';
  if(allowNew) html+='<option value="__new__">+ Add new…</option>';
  html+='</select><span class="err-msg"></span></div>';
  return html;
}
function formSection(title,freq,fields){
  const sec=el('div','form-sec');
  sec.innerHTML='<div class="form-sec-t">'+escapeHtml(title)+(freq?'<span class="freq">'+escapeHtml(freq)+'</span>':'')+'</div><div class="form-grid">'+fields.join('')+'</div>';
  // handle "add new" for company/department selectors
  sec.querySelectorAll('select[data-field-key]').forEach(sel=>{
    sel.addEventListener('change',()=>{
      if(sel.value==='__new__'){
        const label=sel.previousElementSibling? sel.closest('.fg').querySelector('label').textContent.replace(' *','').trim():'value';
        const nv=(prompt('Enter new '+label+':')||'').trim();
        if(nv){ const opt=new Option(nv,nv,true,true); sel.add(opt, sel.options[sel.options.length-1]); sel.value=nv; }
        else { sel.selectedIndex=0; }
        updateCalcPreview();
      }
    });
  });
  return sec;
}

/* ------------------------------------------------------------------ toast */
function toast(msg,type){
  const t=el('div','toast'+(type?' '+type:''), (type==='good'?I.check:type==='bad'?I.alert:'')+'<span>'+escapeHtml(msg)+'</span>');
  $('#toastWrap').appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .3s,transform .3s'; t.style.opacity='0'; t.style.transform='translateX(20px)'; setTimeout(()=>t.remove(),300); },2800);
}

/* ------------------------------------------------------------------ drawer */
function openDrawer(){ $('#overlay').classList.add('open'); $('#drawer').classList.add('open'); }
function closeDrawer(){ $('#overlay').classList.remove('open'); $('#drawer').classList.remove('open'); formState=null; }

/* ------------------------------------------------------------------ events */
function wireGlobalEvents(){
  $('#hamburger').onclick=()=>$('#sidebar').classList.toggle('open');
  $('#drawerClose').onclick=closeDrawer;
  $('#overlay').onclick=closeDrawer;
  const gs=$('#globalSearch');
  gs.addEventListener('input',e=>runSearch(e.target.value));
  gs.addEventListener('focus',e=>{ if(e.target.value)runSearch(e.target.value); });
  document.addEventListener('click',e=>{
    if(!e.target.closest('.global-search')) $('#searchResults').classList.remove('open');
    if(!e.target.closest('.act-wrap')) closeAllMenus();
  });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeDrawer(); $('#searchResults').classList.remove('open'); } });
}
